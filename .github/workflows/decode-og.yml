name: Decode og.png
on:
  push:
    paths: ["og.png.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d og.png.b64 > og.png
          git rm -q og.png.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add og.png
          git commit -m "Decode og.png preview image"
          git push
